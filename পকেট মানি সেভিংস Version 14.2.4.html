<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10B981">
<title>পকেট মানি সেভিংস</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#16A34A;--primary-dark:#DC2626;--grad:linear-gradient(135deg,#16A34A 55%,#DC2626);--expense:#EF4444;--income:#22C55E;--ai:#8B5CF6;
  --bg:#F8FAFC;--card:#FFFFFF;--text:#1F2937;--text-light:#6B7280;--border:#E5E7EB;
  --shadow:0 4px 16px rgba(15,23,42,0.06);--shadow-lg:0 12px 32px rgba(15,23,42,0.12);
}
html[data-theme="dark"]{
  --bg:#0F172A;--card:#1E293B;--text:#F1F5F9;--text-light:#94A3B8;--border:#334155;
  --shadow:0 4px 16px rgba(0,0,0,0.4);--shadow-lg:0 12px 32px rgba(0,0,0,0.5);
}
body{font-family:'Hind Siliguri','Poppins',sans-serif;background:#dbe4ee;color:var(--text);line-height:1.5}
html[data-theme="dark"] body{background:#020617}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.10)}
.screen{min-height:100dvh}
button{touch-action:manipulation}
::-webkit-scrollbar{display:none}

/* ===== Animations ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(48px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes scaleIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes toastIn{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{to{transform:translateY(-16px);opacity:0}}

/* ===== Auth screens ===== */
.auth-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0F172A 0%,#1F2937 55%,var(--primary-dark) 160%)}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:32px 26px;box-shadow:var(--shadow-lg);animation:scaleIn .4s ease}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.brand-logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.35)}
.brand-name{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800}
.auth-sub{text-align:center;color:var(--text-light);font-size:13.5px;margin-bottom:20px}
.auth-hint{text-align:center;font-size:13px;color:var(--text-light);margin-top:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-light);margin-bottom:6px}
.input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--primary)}
select.input{appearance:none}
.form-error{color:var(--expense);font-size:12.5px;font-weight:600;min-height:18px;margin-bottom:10px}
.form-error.center{text-align:center}
.btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(16,185,129,.3);transition:transform .15s;font-family:inherit}
.btn-primary:active{transform:scale(.97)}
.btn-outline{width:100%;padding:13px;border-radius:12px;background:transparent;border:1.5px solid var(--expense);color:var(--expense);font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}

/* ===== PIN pad ===== */
.pin-dots{display:flex;gap:16px;justify-content:center;margin:20px 0 6px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);transition:all .15s}
.pin-dot.filled{background:var(--primary);border-color:var(--primary)}
.pin-dots.error .pin-dot{border-color:var(--expense);background:var(--expense);animation:shake .4s ease}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.key{height:62px;border-radius:16px;border:none;background:var(--bg);font-size:24px;font-weight:700;color:var(--text);cursor:pointer;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.key:active{transform:scale(.93);background:var(--border)}

/* ===== Main layout ===== */
.main-screen{padding-bottom:110px;animation:fadeIn .35s ease}
.main-screen.coach-screen{padding-bottom:0}
.page-header{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px;gap:10px}
.page-title{font-size:22px;font-weight:800;font-family:'Poppins',sans-serif}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-pad{padding:0 20px 10px;margin-bottom:0}
.empty{text-align:center;padding:32px 20px;color:var(--text-light);font-size:13.5px;font-weight:500}
.empty-icon{width:56px;height:56px;border-radius:18px;background:var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;opacity:.8}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.btn-small{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-small.outline-green{background:transparent;border:1.5px solid var(--primary);color:var(--primary);margin-top:10px}
.pos{color:var(--income)}.neg{color:var(--expense)}
.bold{font-weight:800;font-family:'Poppins',sans-serif}

/* ===== Bottom nav & FAB ===== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:none;background:none;color:var(--text-light);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:color .15s}
.nav-item.active{color:var(--primary)}
.fab{position:fixed;bottom:92px;right:max(16px,calc(50% - 224px));width:56px;height:56px;border-radius:18px;border:none;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(16,185,129,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:49;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* ===== Home ===== */
.home-header{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}
.greeting{font-size:13px;color:var(--text-light);font-weight:600}
.username{font-size:20px;font-weight:800;font-family:'Poppins',sans-serif}
.balance-card{margin:6px 16px 16px;background:var(--grad);border-radius:20px;padding:22px;color:#fff;box-shadow:var(--shadow-lg)}
.bal-label{font-size:13px;opacity:.88;font-weight:600}
.bal-amount{font-size:32px;font-weight:800;font-family:'Poppins',sans-serif;margin:2px 0 14px}
.bal-row{display:flex;gap:10px}
.bal-pill{flex:1;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;min-width:0}
.bal-ic{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bal-sub{font-size:10.5px;opacity:.88;font-weight:600}
.bal-val{font-weight:800;font-family:'Poppins',sans-serif;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insights-card{margin:0 16px 16px;padding:16px}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ins-cell{background:var(--bg);border-radius:12px;padding:10px 12px}
.ins-label{font-size:11px;color:var(--text-light);font-weight:600}
.ins-val{font-size:16px;font-weight:800;font-family:'Poppins',sans-serif;margin-top:2px}
.budget-line{margin-top:12px}
.budget-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px;gap:8px}
.progress{height:8px;border-radius:10px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:10px;transition:width .6s ease}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 16px}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--card);border:none;border-radius:16px;box-shadow:var(--shadow);cursor:pointer;font-weight:600;font-size:12px;color:var(--text);font-family:inherit;transition:transform .15s}
.qa-btn:active{transform:scale(.94)}
.qa-ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.break-row{margin-bottom:12px}
.break-row:last-child{margin-bottom:0}
.break-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.search-box{display:flex;align-items:center;gap:10px;margin:0 16px 14px;background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--shadow);border:1.5px solid transparent;color:var(--text-light)}
.search-box:focus-within{border-color:var(--primary)}
.search-box input{flex:1;border:none;background:none;padding:13px 0;font-size:14px;color:var(--text);outline:none;font-family:inherit;min-width:0}
.search-clear{border:none;background:none;color:var(--text-light);cursor:pointer;display:flex}
.tx-list{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.tx-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.tx-item:active{transform:scale(.98)}
.tx-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-cat{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:11.5px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amount{font-weight:800;font-family:'Poppins',sans-serif;font-size:14px;white-space:nowrap}
.tx-amount.income{color:var(--income)}
.tx-amount.expense{color:var(--expense)}

/* ===== Chips & filters ===== */
.chip-row{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.chip-row.wrap{flex-wrap:wrap;padding:0 0 10px;overflow:visible}
.chip-row.in-modal{padding:0 0 12px}
.chip{padding:8px 14px;border-radius:30px;border:1.5px solid var(--border);background:var(--card);color:var(--text-light);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.filter-card{margin:0 16px 14px;padding:14px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.range-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn-ghost{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--text-light);font-weight:700;cursor:pointer;font-family:inherit}
.month-list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.month-card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.month-card:active{transform:scale(.98)}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.mc-name{font-weight:700;font-size:16px}
.mc-net{font-weight:800;font-family:'Poppins',sans-serif}
.mc-row{display:flex;gap:14px;font-size:12px;color:var(--text-light);font-weight:600;flex-wrap:wrap}
.mc-row svg{vertical-align:-3px}

/* ===== Ledger ===== */
.ledger-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 16px 12px}
.ls-card{background:var(--card);border-radius:14px;padding:12px 8px;box-shadow:var(--shadow);text-align:center}
.ls-label{font-size:10.5px;color:var(--text-light);font-weight:600}
.ls-amount{font-size:14px;font-weight:800;font-family:'Poppins',sans-serif;margin-top:4px}
.ledger-list{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ledger-card{padding:14px}
.lc-head{display:flex;gap:12px;align-items:center}
.lc-avatar{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;font-family:'Poppins',sans-serif;flex-shrink:0}
.av-green{background:rgba(34,197,94,.14);color:#16a34a}
.av-red{background:rgba(239,68,68,.14);color:#dc2626}
.lc-info{flex:1;min-width:0}
.lc-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-sub{font-size:11.5px;color:var(--text-light)}
.lc-right{text-align:right;flex-shrink:0}
.lc-amount{font-weight:800;font-family:'Poppins',sans-serif;font-size:14.5px}
.lc-reason{margin-top:10px;font-size:13.5px;font-weight:600}
.lc-note{margin-top:4px;font-size:12px;color:var(--text-light)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:4px}
.badge.gray{background:var(--border);color:var(--text-light)}
.badge.amber{background:rgba(245,158,11,.15);color:#d97706}

/* ===== Dashboard ===== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.stat-grid.three{grid-template-columns:1fr 1fr 1fr}
.stat-card{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.stat-ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-val{font-size:15.5px;font-weight:800;font-family:'Poppins',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-label{font-size:11px;color:var(--text-light);font-weight:600;margin-top:2px}
.ai-card{margin:0 16px 14px;padding:16px;background:linear-gradient(135deg,rgba(139,92,246,.09),transparent 55%),var(--card);border:1px solid rgba(139,92,246,.25)}
.ai-dot{width:26px;height:26px;border-radius:9px;background:rgba(139,92,246,.15);color:var(--ai);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.insight-row{display:flex;gap:12px;padding:10px 0}
.insight-row+.insight-row{border-top:1px dashed var(--border)}
.insight-icon{width:34px;height:34px;border-radius:11px;background:rgba(139,92,246,.12);color:var(--ai);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.insight-title{font-weight:700;font-size:13.5px}
.insight-text{font-size:12.5px;color:var(--text-light);line-height:1.55;margin-top:2px}
.chart-card{margin:0 16px 14px;padding:16px}
.chart-box{position:relative;height:220px}
.chart-box.pie{height:280px}

/* ===== Coach ===== */
.coach-wrap{display:flex;flex-direction:column;height:calc(100dvh - 78px)}
.chat-area{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.6;animation:fadeIn .25s ease;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.coach-q{padding:8px 16px}
.chat-input-bar{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.send-btn{width:48px;height:48px;border-radius:14px;border:none;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* ===== Profile & settings ===== */
.profile-card{margin:0 16px 14px;padding:22px;text-align:center}
.avatar{width:72px;height:72px;border-radius:24px;background:var(--grad);color:#fff;font-size:30px;font-weight:800;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.profile-name{font-size:19px;font-weight:800;font-family:'Poppins',sans-serif}
.profile-sub{font-size:12.5px;color:var(--text-light);margin-top:2px}
.settings-card{margin:0 16px 16px;padding:8px 0;overflow:hidden}
.settings-card .section-title{padding:12px 16px 4px;margin:0}
.setting-row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.setting-row+.setting-row{border-top:1px solid var(--border)}
.setting-icon{width:36px;height:36px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
.setting-row.danger .setting-icon{color:var(--expense)}
.setting-row.danger .setting-label{color:var(--expense)}
.setting-label{flex:1;font-weight:600;font-size:14.5px}
.setting-right{display:flex;align-items:center;gap:6px;color:var(--text-light)}
.row-val{font-size:13px;font-weight:700;color:var(--text-light)}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border);border-radius:30px;transition:.2s;cursor:pointer}
.slider:before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--primary)}
.switch input:checked+.slider:before{transform:translateX(20px)}

/* ===== Modals ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .2s ease}
.modal-sheet{width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:slideUp .3s ease}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.modal-title{font-size:18px;font-weight:800;font-family:'Poppins',sans-serif}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:14px}
.type-btn{padding:11px;border:none;border-radius:10px;background:transparent;font-weight:700;font-size:14px;color:var(--text-light);cursor:pointer;font-family:inherit;transition:all .15s}
.type-btn.income.active{background:var(--income);color:#fff}
.type-btn.expense.active{background:var(--expense);color:#fff}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:11.5px;font-weight:600;color:var(--text);font-family:inherit;transition:all .15s}
.cat-btn.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
.cat-ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.amount-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;padding:4px 12px}
.amount-row:focus-within{border-color:var(--primary)}
.cur-sym{font-size:22px;font-weight:800;color:var(--text-light);font-family:'Poppins',sans-serif}
.amount-input{flex:1;border:none;background:none;outline:none;font-size:30px;font-weight:800;font-family:'Poppins',sans-serif;color:var(--text);text-align:center;min-width:0;padding:10px 0}
.picker-row{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;cursor:pointer;font-weight:600}
.picker-row:hover{background:var(--bg)}
.picker-row.active{color:var(--primary)}
.picker-sym{width:36px;height:36px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Poppins',sans-serif;font-size:13px;flex-shrink:0}
.md-totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:var(--bg);border-radius:14px;padding:12px;margin-bottom:12px;text-align:center}
.md-label{font-size:11px;color:var(--text-light);font-weight:600}
.confirm-icon{width:60px;height:60px;border-radius:20px;background:rgba(239,68,68,.12);color:var(--expense);display:flex;align-items:center;justify-content:center;margin:4px auto 14px}
.confirm-title{text-align:center;font-size:18px;font-weight:800;font-family:'Poppins',sans-serif;margin-bottom:6px}
.confirm-desc{text-align:center;font-size:13.5px;color:var(--text-light);margin-bottom:18px;line-height:1.55}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-cancel{padding:13px;border-radius:12px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-weight:700;cursor:pointer;font-family:inherit}
.btn-danger{padding:13px;border-radius:12px;border:none;background:var(--expense);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}

/* ===== Calculator ===== */
.calc-display{background:var(--bg);border-radius:14px;padding:16px;text-align:right;margin-bottom:14px;min-height:88px}
.calc-expr{font-size:16px;color:var(--text-light);min-height:24px;word-break:break-all;font-family:'Poppins',sans-serif}
.calc-result{font-size:32px;font-weight:800;font-family:'Poppins',sans-serif;color:var(--primary);min-height:40px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc-key{height:56px;border-radius:14px;border:none;background:var(--bg);font-size:20px;font-weight:700;color:var(--text);cursor:pointer;font-family:'Poppins',sans-serif;transition:transform .12s}
.calc-key:active{transform:scale(.93)}
.calc-key.op{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.calc-key.eq{background:var(--primary);color:#fff}
.calc-key.danger{color:var(--expense)}

/* ===== Toasts ===== */
#toast-root{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;color:#fff;font-weight:600;font-size:13.5px;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
.toast.out{animation:toastOut .3s ease forwards}
.toast.success{background:var(--primary)}
.toast.error{background:#EF4444}
.toast.warning{background:#F59E0B}
.toast.info{background:#1F2937}

@media print{.bottom-nav,.fab{display:none}}
.swatch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
.sw-c{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:3px solid transparent;box-shadow:var(--shadow)}
.swatch.active .sw-c{border-color:var(--text)}
.cc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:12px;margin-bottom:8px}
.cc-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.cc-name{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.col-dot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.col-dot.active{border-color:var(--text)}
</style>

/* cyrb53 hash — PIN is never stored in plain text */
function hashPIN(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}

function todayStr(){ return dateStr(new Date()); }
function dateOffset(n){ const d = new Date(); d.setDate(d.getDate()+n); return dateStr(d); }
function nowLocal(){ const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function fmtAmount(n){
  const v = Math.round((+n + Number.EPSILON)*100)/100;
  let s = v.toLocaleString('en-US',{maximumFractionDigits:2});
  if (db.language==='bn') s = bnNum(s);
  return CURRENCIES[db.currency]+s;
}
function fmtNum(n){ let s = Number(n).toLocaleString('en-US',{maximumFractionDigits:2}); return db.language==='bn' ? bnNum(s) : s; }
function fmtDate(ds){
  if (!ds) return '';
  const p = ds.split('-'); const y = +p[0], m = +p[1], d = +p[2];
  if (db.language==='bn') return bnNum(d)+' '+MONTHS_BN[m-1]+' '+bnNum(y);
  return MONTHS_EN_S[m-1]+' '+d+', '+y;
}
function fmtDateTime(dt){
  if (!dt) return '';
  const parts = dt.split('T'); const d = parts[0]; let ts = parts[1] || '';
  if (ts){
    const tp = ts.split(':'); let h = +tp[0]; const m = +tp[1];
    if (db.language==='bn') ts = bnNum(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
    else { const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; ts = h+':'+String(m).padStart(2,'0')+' '+ap; }
  }
  return fmtDate(d) + (ts ? ', '+ts : '');
}

  return out.sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

function findEntry(id, mk){ const b = db.months[mk]; return b ? b.entries.find(x => x.id === id) : null; }
function groupByMonth(list){
  const map = {};
  list.forEach(e => { (map[e.monthKey] = map[e.monthKey] || []).push(e); });
  return Object.keys(map).sort((a,b) => b.localeCompare(a)).map(k => [k, map[k]]);
}
function filteredEntries(){
  const hf = UI.hf;
  let list = allEntries();
  if (hf.type !== 'all') list = list.filter(e => e.type === hf.type);
  if (hf.category !== 'all') list = list.filter(e => e.category === hf.category);
  if (hf.min !== '' && !isNaN(parseFloat(hf.min))) list = list.filter(e => e.amount >= parseFloat(hf.min));
  if (hf.max !== '' && !isNaN(parseFloat(hf.max))) list = list.filter(e => e.amount <= parseFloat(hf.max));
  const today = todayStr();
  if (hf.date === 'today') list = list.filter(e => e.date === today);
  else if (hf.date === 'yesterday'){ const y = dateOffset(-1); list = list.filter(e => e.date === y); }
  else if (hf.date === 'week'){ const c = dateOffset(-6); list = list.filter(e => e.date >= c); }
  else if (hf.date === 'month'){ const mk = today.slice(0,7); list = list.filter(e => e.monthKey === mk); }
  else if (hf.date === 'custom'){ if (hf.from) list = list.filter(e => e.date >= hf.from); if (hf.to) list = list.filter(e => e.date <= hf.to); }
  return list;
}

function doSetup(){
  const name = document.getElementById('setup-name').value.trim();
  const pin = document.getElementById('setup-pin').value.trim();
  const pin2 = document.getElementById('setup-pin2').value.trim();
  const err = document.getElementById('setup-error');
  if (!name){ err.textContent = t('errName'); return; }
  if (!/^\d{4}$/.test(pin)){ err.textContent = t('errPinFormat'); return; }
  if (pin !== pin2){ err.textContent = t('errPinMatch'); return; }
  const lim = parseFloat((document.getElementById('setup-limit')||{}).value);
  if (lim > 0) db.dailyPocketLimit = lim;
  db.lockEnabled = true;
  db.name = name; db.pinHash = hashPIN(pin); saveDB();
  UI.screen = 'main'; UI.tab = 'home'; renderApp(); histPush({ app:1 });
  toast(L('Account created! Welcome, ','অ্যাকাউন্ট তৈরি হয়েছে! স্বাগতম, ')+name);
}

function unlockHTML(){

    else { pad += '<button class="key" onclick="pressPin('+k+')">'+(db.language==='bn' ? bnNum(k) : k)+'</button>'; }
  });
  return '<div class="screen auth-screen"><div class="auth-card">'+

    '<div class="keypad">'+pad+'</div>'+
  '</div></div>';
}
function updatePinDots(){ document.querySelectorAll('.pin-dot').forEach((el,i) => el.classList.toggle('filled', i < UI.pinBuffer.length)); }
function pressPin(d){
  if (UI.pinBuffer.length >= 4) return;
  UI.pinBuffer += d; updatePinDots();
  if (UI.pinBuffer.length === 4) setTimeout(verifyPin, 180);
}
function delPin(){ UI.pinBuffer = UI.pinBuffer.slice(0,-1); updatePinDots(); }
function verifyPin(){
  if (hashPIN(UI.pinBuffer) === db.pinHash){
    UI.pinBuffer = ''; UI.attempts = 5; UI.screen = 'main'; UI.tab = 'home';
    renderApp(); histPush({ app:1 });
  } else {
    UI.attempts--;
    const dots = document.getElementById('pin-dots');
    const err = document.getElementById('unlock-error');
    if (UI.attempts <= 0){ if (err) err.textContent = t('wrongPin'); setTimeout(() => location.reload(), 900); return; }
    if (err) err.textContent = t('wrongPin')+' · '+fmtNum(UI.attempts)+' '+t('attemptsLeft');
    if (dots){ dots.classList.add('error'); setTimeout(() => { dots.classList.remove('error'); UI.pinBuffer = ''; updatePinDots(); }, 450); }
  }
}

function homeHTML(){
  const entries = allEntries();

  const earnedToday = tEntries.filter(e => e.type==='income').reduce((s,e) => s+e.amount, 0);
  const netToday = earnedToday - spentToday;
  const pocketToday = tEntries.filter(e => e.type==='expense' && e.category==='pocket').reduce((s,e) => s+e.amount, 0);
  const limit = db.dailyPocketLimit || 50;
  const remaining = limit - pocketToday;
  const ratio = limit > 0 ? pocketToday/limit : 0;
  const pct = Math.min(100, Math.round(ratio*100));
  const status = ratio <= 0.7 ? 'good' : ratio <= 1 ? 'warn' : 'danger';
  const statusColor = status === 'good' ? '#22C55E' : status === 'warn' ? '#F59E0B' : '#EF4444';
  const statusKey = status === 'good' ? 'budgetGood' : status === 'warn' ? 'budgetWarn' : 'budgetDanger';

function saveEntryUI(){
  const u = UI.entry;
  const amount = parseFloat(u.amount);
  const err = document.getElementById('entry-error');
  const bad = m => { if (err) err.textContent = m; };
  if (!(amount > 0)) return bad(t('errAmount'));
  if (!u.date) return bad(t('errDate'));
  if (u.category === 'custom' && !u.customName.trim()) return bad(t('errCustomName'));
  const mk = u.date.slice(0,7);
  if (u.mode === 'edit'){
    const old = db.months[u.monthKey];
    if (old){ old.entries = old.entries.filter(x => x.id !== u.id); if (!old.entries.length) delete db.months[u.monthKey]; }
  }
  const e = { id: u.mode === 'edit' ? u.id : uid(), type:u.type, category:u.category, amount:amount, date:u.date, note:u.note.trim(), customName: u.category === 'custom' ? u.customName.trim() : (findCC(u.category) ? findCC(u.category).name : '') };
  if (!db.months[mk]) db.months[mk] = { entries: [] };
  db.months[mk].entries.push(e);
  saveDB(); popModal(); renderApp();
  toast(u.mode === 'edit' ? t('entryUpdated') : t('entrySaved'));
}
function askDeleteEntry(){

/* ================= CALCULATOR ================= */
function openCalculator(){ UI.calc = { expr:'', fresh:false }; pushModal(calcModalHTML); }
function calcModalHTML(){
  const rows = [['(',')','C','⌫'],['7','8','9','÷'],['4','5','6','×'],['1','2','3','−'],['0','.','=','+']];
  let grid = '';
  rows.forEach(r => {
    r.forEach(k => {
      let cls = 'calc-key', fn = 'calcPress';
      if (k === '='){ cls += ' eq'; fn = 'calcEquals'; }
      else if (k === 'C'){ cls += ' danger'; fn = 'calcClear'; }
      else if (k === '⌫'){ cls += ' danger'; fn = 'calcBack'; }
      else if ('÷×−+'.indexOf(k) !== -1){ cls += ' op'; }
      grid += '<button class="'+cls+'" onclick="'+fn+'(\''+k+'\')">'+(db.language==='bn' && /[0-9]/.test(k) ? bnNum(k) : k)+'</button>';
    });
  });
  return '<div class="modal-header"><span class="modal-title">'+t('calculator')+'</span><button class="icon-btn sm" onclick="popModal()">'+icon('x',18)+'</button></div>'+
    '<div class="calc-display"><div class="calc-expr" id="calc-expr">0</div><div class="calc-result" id="calc-result"></div></div>'+
    '<div class="calc-grid">'+grid+'</div>';
}
function updateCalcDisplay(){ const e = document.getElementById('calc-expr'); if (e) e.textContent = UI.calc.expr || '0'; }
function calcPress(k){
  if (k === '=' || k === 'C' || k === '⌫') return;
  if (UI.calc.fresh){ UI.calc.expr = ''; UI.calc.fresh = false; const r = document.getElementById('calc-result'); if (r) r.textContent = ''; }
  UI.calc.expr += k; updateCalcDisplay();
}
function calcClear(){ UI.calc.expr = ''; UI.calc.fresh = false; updateCalcDisplay(); const r = document.getElementById('calc-result'); if (r) r.textContent = ''; }
function calcBack(){ UI.calc.expr = UI.calc.expr.slice(0,-1); updateCalcDisplay(); }
function evalExpr(expr){
  const clean = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if (!/^[0-9+\-*/().\s]+$/.test(clean) || !clean.trim()) return null;
  try { const v = Function('"use strict";return('+clean+')')(); if (typeof v === 'number' && isFinite(v)) return Math.round(v*100)/100; } catch(e){}
  return null;
}
function calcEquals(){
  const v = evalExpr(UI.calc.expr);
  const r = document.getElementById('calc-result');
  if (v === null){ if (r) r.textContent = t('errAmount'); return; }
  if (r) r.textContent = '= '+fmtAmount(v);
  UI.calc.fresh = true;
  const token = ++UI.calcToken;
  setTimeout(() => {
    if (token !== UI.calcToken) return;
    if (modalStack.length && modalStack[modalStack.length-1] === calcModalHTML){ UI.entry.amount = String(v); popModal(); }
  }, 800);
}

function periodBuckets(p){
  const labels = [], keys = [];
  const now = new Date();
  if (p === 'year'){
    for (let i = 11; i >= 0; i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
      labels.push(db.language === 'bn' ? MONTHS_BN_S[d.getMonth()] : MONTHS_EN_S[d.getMonth()]);
    }
  } else {
    const days = p === 'week' ? 7 : 30;
    for (let i = days-1; i >= 0; i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      keys.push(dateStr(d));
      labels.push(p === 'week' ? (db.language === 'bn' ? DAYS_BN[d.getDay()] : DAYS_EN[d.getDay()]) : (db.language === 'bn' ? bnNum(d.getDate()) : String(d.getDate())));
    }
  }
  return { labels:labels, keys:keys };
}

/* ================= AI ANALYSIS (rule-based, local) ================= */
function aiInsights(){
  const out = [];
  const entries = allEntries();
  const exps = entries.filter(e => e.type === 'expense');
  if (!entries.length){
    out.push({ icon:'info', title:L('Getting Started','শুরু করুন'), text:L('Add your first income or expense and I will start analyzing your money habits.','প্রথম আয় বা খরচ যোগ করুন, তারপর আমি আপনার টাকার অভ্যাস বিশ্লেষণ শুরু করব।') });
    return out;
  }
  const tt = totals(entries);
  const byDate = {};
  exps.forEach(e => { byDate[e.date] = (byDate[e.date]||0)+e.amount; });
  const maxDay = Object.keys(byDate).map(k => [k, byDate[k]]).sort((a,b) => b[1]-a[1])[0];
  if (maxDay) out.push({ icon:'star', title:L('Highest Spending Day','সর্বোচ্চ খরচের দিন'), text:L('You spent the most on '+fmtDate(maxDay[0])+': '+fmtAmount(maxDay[1])+'.', fmtDate(maxDay[0])+' তারিখে সবচেয়ে বেশি খরচ করেছেন: '+fmtAmount(maxDay[1])+'।') });
  const byCat = {};
  exps.forEach(e => { const k = catName(e); byCat[k] = (byCat[k]||0)+e.amount; });
  const topCat = Object.keys(byCat).map(k => [k, byCat[k]]).sort((a,b) => b[1]-a[1])[0];
  if (topCat && tt.expense > 0) out.push({ icon:'pie-chart', title:L('Top Category','শীর্ষ ক্যাটাগরি'), text:L(topCat[0]+' is your biggest expense: '+fmtAmount(topCat[1])+' ('+fmtNum(Math.round(topCat[1]/tt.expense*100))+'% of all expenses).', topCat[0]+' ক্যাটাগরিতে খরচ সবচেয়ে বেশি: '+fmtAmount(topCat[1])+' (মোট খরচের '+fmtNum(Math.round(topCat[1]/tt.expense*100))+'%)।') });
  const d7 = dateOffset(-6);
  const last7 = exps.filter(e => e.date >= d7);
  const sum7 = last7.reduce((s,e) => s+e.amount, 0);
  out.push({ icon:'trending-up', title:L('Spending Trend','খরচের প্রবণতা'), text:L('Last 7 days: '+fmtAmount(sum7)+' across '+fmtNum(last7.length)+' expenses (avg '+fmtAmount(Math.round(sum7/7))+'/day).', 'গত ৭ দিনে '+fmtNum(last7.length)+'টি খরচে মোট '+fmtAmount(sum7)+' (দৈনিক গড় '+fmtAmount(Math.round(sum7/7))+')।') });
  const d14 = dateOffset(-13);
  const prev7 = exps.filter(e => e.date >= d14 && e.date < d7);
  const sumPrev = prev7.reduce((s,e) => s+e.amount, 0);
  if (sumPrev > 0){
    const change = Math.round((sum7-sumPrev)/sumPrev*100);
    out.push({ icon:'bar-chart', title:L('Weekly Comparison','সাপ্তাহিক তুলনা'), text: change >= 0 ?
      L('You spent '+fmtNum(change)+'% more this week than last week ('+fmtAmount(sum7)+' vs '+fmtAmount(sumPrev)+').', 'এই সপ্তাহে গত সপ্তাহের তুলনায় '+fmtNum(change)+'% বেশি খরচ করেছেন ('+fmtAmount(sum7)+' বনাম '+fmtAmount(sumPrev)+')।') :
      L('You spent '+fmtNum(Math.abs(change))+'% less this week than last week. Great job!', 'এই সপ্তাহে গত সপ্তাহের তুলনায় '+fmtNum(Math.abs(change))+'% কম খরচ করেছেন। দারুণ!') });
  }
  const curMK = todayStr().slice(0,7);
  const nowD = new Date();
  const prevD = new Date(nowD.getFullYear(), nowD.getMonth()-1, 1);
  const prevMK = prevD.getFullYear()+'-'+String(prevD.getMonth()+1).padStart(2,'0');
  const curSum = exps.filter(e => e.monthKey === curMK).reduce((s,e) => s+e.amount, 0);
  const prevSum = exps.filter(e => e.monthKey === prevMK).reduce((s,e) => s+e.amount, 0);
  if (prevSum > 0){
    const ch = Math.round((curSum-prevSum)/prevSum*100);
    out.push({ icon:'calendar', title:L('Monthly Comparison','মাসিক তুলনা'), text: ch >= 0 ?
      L(monthName(curMK)+' so far: '+fmtAmount(curSum)+' — '+fmtNum(ch)+'% more than '+monthName(prevMK)+' ('+fmtAmount(prevSum)+').', monthName(curMK)+' মাসে এ পর্যন্ত '+fmtAmount(curSum)+' — '+monthName(prevMK)+' মাসের ('+fmtAmount(prevSum)+') তুলনায় '+fmtNum(ch)+'% বেশি।') :
      L(monthName(curMK)+' so far: '+fmtAmount(curSum)+' — '+fmtNum(Math.abs(ch))+'% less than '+monthName(prevMK)+'.', monthName(curMK)+' মাসে এ পর্যন্ত '+fmtAmount(curSum)+' — '+monthName(prevMK)+' মাসের তুলনায় '+fmtNum(Math.abs(ch))+'% কম।') });
  }
  if (tt.income > 0){
    const rate = Math.round((tt.income-tt.expense)/tt.income*100);
    let msg;
    if (rate >= 20) msg = L('Excellent! You save '+fmtNum(rate)+'% of your income. Keep it up!', 'চমৎকার! আপনি আয়ের '+fmtNum(rate)+'% সঞ্চয় করছেন। এভাবেই চালিয়ে যান!');
    else if (rate >= 0) msg = L('You save '+fmtNum(rate)+'% of your income. Try to reach at least 20%.', 'আপনি আয়ের '+fmtNum(rate)+'% সঞ্চয় করছেন। কমপক্ষে ২০% পৌঁছানোর চেষ্টা করুন।');
    else msg = L('You spend more than you earn ('+fmtNum(rate)+'%). Time to cut back!', 'আপনি আয়ের চেয়ে বেশি খরচ করছেন ('+fmtNum(rate)+'%)। খরচ কমানোর সময় এসেছে!');
    out.push({ icon:'wallet', title:L('Financial Habit','আর্থিক অভ্যাস'), text:msg });
  }
  const today = todayStr();
  const pocketToday = exps.filter(e => e.date === today && e.category === 'pocket').reduce((s,e) => s+e.amount, 0);
  const limit = db.dailyPocketLimit || 50;
  const pctB = Math.round(pocketToday/limit*100);
  let bmsg;
  if (pctB <= 70) bmsg = L('You have used '+fmtAmount(pocketToday)+' of your '+fmtAmount(limit)+' daily pocket budget ('+fmtNum(pctB)+'%). You are on track.', 'আপনার দৈনিক পকেট বাজেট '+fmtAmount(limit)+'-এর মধ্যে '+fmtAmount(pocketToday)+' খরচ হয়েছে ('+fmtNum(pctB)+'%)। আপনি ভালো আছেন।');
  else if (pctB <= 100) bmsg = L('Careful — '+fmtNum(pctB)+'% of your daily pocket budget is used ('+fmtAmount(pocketToday)+' of '+fmtAmount(limit)+').', 'সাবধান — দৈনিক পকেট বাজেটের '+fmtNum(pctB)+'% ব্যবহৃত হয়েছে ('+fmtAmount(limit)+'-এর মধ্যে '+fmtAmount(pocketToday)+')।');
  else bmsg = L('Budget exceeded! You spent '+fmtAmount(pocketToday)+' against a '+fmtAmount(limit)+' daily limit.', 'বাজেট অতিক্রম করেছেন! দৈনিক সীমা '+fmtAmount(limit)+'-এর বিপরীতে '+fmtAmount(pocketToday)+' খরচ হয়েছে।');
  out.push({ icon:'alert-triangle', title:L('Budget Performance','বাজেট পারফরম্যান্স'), text:bmsg });
  if (topCat) out.push({ icon:'zap', title:L('Saving Tip','সঞ্চয়ের টিপস'), text:L('Cutting "'+topCat[0]+'" spending by just 10% would save you about '+fmtAmount(Math.round(topCat[1]*0.1))+' per month.', '"'+topCat[0]+'" খরচ মাত্র ১০% কমালে মাসে প্রায় '+fmtAmount(Math.round(topCat[1]*0.1))+' সাশ্রয় হবে।') });
  return out;
}

function scrollChatBottom(){ const el = document.getElementById('chat-area'); if (el) el.scrollTop = el.scrollHeight; }
function quickCoach(i){ sendCoach(coachQuestions()[i].q); }
function sendCoach(text){
  const input = document.getElementById('coach-input');
  const q = (text != null ? text : (input ? input.value : '')).trim();
  if (!q) return;
  UI.coach.push({ role:'user', text:esc(q) });
  UI.coach.push({ role:'ai', text:coachAnswer(q) });
  renderApp();
}
function coachAnswer(q){
  const s = q.toLowerCase();
  const entries = allEntries();
  const exps = entries.filter(e => e.type === 'expense');
  const tt = totals(entries);
  const has = function(){ for (let i = 0; i < arguments.length; i++){ if (s.indexOf(arguments[i]) !== -1) return true; } return false; };
  if (!entries.length) return L('You have no transactions yet. Add some income or expenses first, then ask me anything!','আপনার এখনো কোনো লেনদেন নেই। আগে কিছু আয় বা খরচ যোগ করুন, তারপর আমাকে প্রশ্ন করুন!');
  const byCat = {};
  exps.forEach(e => { const k = catName(e); byCat[k] = (byCat[k]||0)+e.amount; });
  const topCat = Object.keys(byCat).map(k => [k, byCat[k]]).sort((a,b) => b[1]-a[1])[0];
  if ((has('where') && has('spent')) || has('কোথায়')){
    if (!topCat) return L('You have no expenses recorded yet.','এখনো কোনো খরচ রেকর্ড করা হয়নি।');
    const pct = Math.round(topCat[1]/tt.expense*100);
    return L('Your biggest spending category is <strong>'+esc(topCat[0])+'</strong> at <strong>'+fmtAmount(topCat[1])+'</strong> — that is '+fmtNum(pct)+'% of all your expenses. Consider setting a small weekly cap for it.',
      'আপনার সবচেয়ে বড় খরচের ক্যাটাগরি <strong>'+esc(topCat[0])+'</strong> — <strong>'+fmtAmount(topCat[1])+'</strong>, অর্থাৎ মোট খরচের '+fmtNum(pct)+'%। এটির জন্য সাপ্তাহিক একটি ছোট সীমা ঠিক করে দেখতে পারেন।');
  }
  if (has('save','saving','সঞ্চয়')){
    const tip1 = topCat ? L('Reduce <strong>'+esc(topCat[0])+'</strong> by 10% → saves about <strong>'+fmtAmount(Math.round(topCat[1]*0.1))+'</strong>/month','<strong>'+esc(topCat[0])+'</strong> খরচ ১০% কমান → মাসে প্রায় <strong>'+fmtAmount(Math.round(topCat[1]*0.1))+'</strong> সাশ্রয়') : '';
    return L('Here are ways to save more:<br>1. '+tip1+'<br>2. Keep pocket spending under your daily limit of <strong>'+fmtAmount(db.dailyPocketLimit)+'</strong><br>3. Follow the 50/30/20 rule — needs, wants, savings.',
      'আরও সঞ্চয়ের উপায়:<br>১. '+tip1+'<br>২. দৈনিক সীমা <strong>'+fmtAmount(db.dailyPocketLimit)+'</strong>-এর মধ্যে পকেট খরচ রাখুন<br>৩. ৫০/৩০/২০ নিয়ম মানুন — প্রয়োজন, চাহিদা, সঞ্চয়।');
  }
  if ((has('average','avg') && has('daily','day')) || has('গড়')){
    const dates = new Set(exps.map(e => e.date));
    const avg = dates.size ? tt.expense/dates.size : 0;
    return L('Your average daily expense is <strong>'+fmtAmount(Math.round(avg))+'</strong> across '+fmtNum(dates.size)+' active days. Your daily pocket limit is <strong>'+fmtAmount(db.dailyPocketLimit)+'</strong>.',
      'আপনার দৈনিক গড় খরচ <strong>'+fmtAmount(Math.round(avg))+'</strong> ('+fmtNum(dates.size)+'টি সক্রিয় দিনে)। আপনার দৈনিক পকেট সীমা <strong>'+fmtAmount(db.dailyPocketLimit)+'</strong>।');
  }
  if (has('afford','কিনতে','কেনা')){
    const threshold = Math.round(tt.net*0.2);
    return L('Your current balance is <strong>'+fmtAmount(tt.net)+'</strong>. Rule of thumb: if the purchase costs more than 20% of your balance (<strong>'+fmtAmount(threshold)+'</strong>), wait a day and reconsider. Never borrow for non-essentials!',
      'আপনার বর্তমান ব্যালেন্স <strong>'+fmtAmount(tt.net)+'</strong>। মূলনীতি: কেনাকাটার দাম ব্যালেন্সের ২০% (<strong>'+fmtAmount(threshold)+'</strong>) এর বেশি হলে একদিন অপেক্ষা করে ভেবে দেখুন। অপ্রয়োজনীয় জিনিসের জন্য কখনো ধার করবেন না!');
  }
  if (has('waste','অপচয়')){
    if (!topCat) return L('No expenses yet, so nothing is being wasted!','এখনো কোনো খরচ নেই, তাই কোনো অপচয়ও নেই!');
    const pct = Math.round(topCat[1]/tt.expense*100);
    return L('<strong>'+esc(topCat[0])+'</strong> eats the most money — <strong>'+fmtAmount(topCat[1])+'</strong> ('+fmtNum(pct)+'% of expenses). Review each entry in that category and ask: was it truly necessary?',
      '<strong>'+esc(topCat[0])+'</strong> ক্যাটাগরিতে সবচেয়ে বেশি টাকা যাচ্ছে — <strong>'+fmtAmount(topCat[1])+'</strong> (মোট খরচের '+fmtNum(pct)+'%)। এই ক্যাটাগরির প্রতিটি এন্ট্রি দেখে ভাবুন: এটি কি সত্যিই দরকার ছিল?');
  }
  return L('Here is your snapshot: Income <strong>'+fmtAmount(tt.income)+'</strong>, Expenses <strong>'+fmtAmount(tt.expense)+'</strong>, Balance <strong>'+fmtAmount(tt.net)+'</strong> across '+fmtNum(entries.length)+' transactions. Ask me about top spending, saving, daily average, affordability or waste!',
    'আপনার সারসংক্ষেপ: আয় <strong>'+fmtAmount(tt.income)+'</strong>, খরচ <strong>'+fmtAmount(tt.expense)+'</strong>, ব্যালেন্স <strong>'+fmtAmount(tt.net)+'</strong> — মোট '+fmtNum(entries.length)+'টি লেনদেন। আমাকে জিজ্ঞেস করুন সর্বোচ্চ খরচ, সঞ্চয়, দৈনিক গড়, কেনার সামর্থ্য বা অপচয় নিয়ে!');
}

      '<div class="field"><label>'+t('confirmNewPin')+'</label><input id="cp-new2" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>'+
      '<div class="form-error" id="cp-error"></div>'+
      '<button class="btn-primary" onclick="saveChangePIN()">'+t('save')+'</button>';
  });
}
function saveChangePIN(){
  const o = document.getElementById('cp-old').value.trim();
  const n = document.getElementById('cp-new').value.trim();
  const n2 = document.getElementById('cp-new2').value.trim();
  const err = document.getElementById('cp-error');
  if (hashPIN(o) !== db.pinHash){ err.textContent = t('wrongCurrentPin'); return; }
  if (!/^\d{4}$/.test(n)){ err.textContent = t('errPinFormat'); return; }
  if (n !== n2){ err.textContent = t('errPinMatch'); return; }
  db.pinHash = hashPIN(n); saveDB(); popModal(); toast(t('pinChanged'));
}
function askResetData(){
  confirmAction(t('resetConfirmTitle'), t('resetConfirmDesc'), () => {
    storage.remove(DB_KEY);
    const lang = db.language, theme = db.theme, tid = db.themeId, tcol = db.customColor;
    db = freshDB(); db.language = lang; db.theme = theme; db.themeId = tid; db.customColor = tcol;
    UI.screen = 'setup'; UI.tab = 'home'; UI.coach = []; UI.search = ''; UI.pinBuffer = ''; UI.attempts = 5;
    clearHFState(); closeAllModals(); applyTheme(); renderApp(); toast(t('dataReset'), 'info');
  });
}

/* ================= APP LOCK TOGGLE ================= */
function toggleLock(el){
  if (el.checked){ db.lockEnabled = true; saveDB(); renderApp(); toast(t('lockOn')); return; }
  el.checked = true;
  pushModal(function(){
    return '<div class="modal-header"><span class="modal-title">'+t('appLock')+'</span><button class="icon-btn sm" onclick="popModal()">'+icon('x',18)+'</button></div>'+
      '<p class="auth-hint" style="margin:0 0 12px">'+t('enterPinToOff')+'</p>'+
      '<div class="field"><input id="lk-pin" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>'+
      '<div class="form-error" id="lk-error"></div>'+
      '<button class="btn-primary" onclick="confirmLockOff()">'+t('turnOff')+'</button>';
  });
}
function confirmLockOff(){
  const v = document.getElementById('lk-pin').value.trim();
  if (hashPIN(v) !== db.pinHash){ document.getElementById('lk-error').textContent = t('wrongPin'); return; }
  db.lockEnabled = false; saveDB(); popModal(); renderApp(); toast(t('lockOff'), 'info');
}

/* ================= PDF REPORTS (daily / monthly / yearly) ================= */
const REP = { type:'daily', day:'', month:'', year:'', busy:false };
function openReport(){
  const td = todayStr();
  REP.day = REP.day || td; REP.month = REP.month || td.slice(0,7); REP.year = REP.year || td.slice(0,4);
  pushModal(reportModalHTML);
}
function reportModalHTML(){
  const types = [['daily','daily'],['monthly','monthly'],['yearly','yearly']];
  let chips = '';
  types.forEach(x => { chips += '<button class="chip'+(REP.type===x[0]?' active':'')+'" onclick="setRepType(\''+x[0]+'\')">'+t(x[1])+'</button>'; });
  let field;
  if (REP.type === 'daily') field = '<label>'+t('selDay')+'</label><input id="rep-val" class="input" type="date" value="'+REP.day+'" onchange="REP.day=this.value">';
  else if (REP.type === 'monthly') field = '<label>'+t('selMonth')+'</label><input id="rep-val" class="input" type="month" value="'+REP.month+'" onchange="REP.month=this.value">';
  else field = '<label>'+t('selYear')+'</label><input id="rep-val" class="input" type="number" min="2000" max="2100" value="'+REP.year+'" onchange="REP.year=this.value">';
  return '<div class="modal-header"><span class="modal-title">'+t('reportTitle')+'</span><button class="icon-btn sm" onclick="popModal()">'+icon('x',18)+'</button></div>'+
    '<div class="chip-row wrap in-modal">'+chips+'</div>'+
    '<div class="field">'+field+'</div>'+
    '<div class="form-error" id="rep-error"></div>'+
    '<button class="btn-primary" id="rep-btn" onclick="downloadReport()">'+t('download')+'</button>';
}
function setRepType(x){ REP.type = x; renderModalTop(); }

function repPeriod(){
  if (REP.type === 'daily') return { key:REP.day, label:fmtDate(REP.day), title:t('repDaily'), match:e => e.date === REP.day };
  if (REP.type === 'monthly') return { key:REP.month, label:REP.month ? monthName(REP.month) : '', title:t('repMonthly'), match:e => e.date.slice(0,7) === REP.month };
  return { key:REP.year, label:db.language==='bn' ? bnNum(REP.year) : REP.year, title:t('repYearly'), match:e => e.date.slice(0,4) === String(REP.year) };
}
function buildReportHTML(){
  const per = repPeriod();
  const list = allEntries().filter(per.match).sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  const tt = totals(list), limit = db.dailyPocketLimit || 0;
  const th = 'style="text-align:left;padding:7px 8px;background:#ECFDF5;color:#065F46;font-size:12px;border-bottom:1px solid #D1FAE5"';
  const td = 'style="padding:7px 8px;border-bottom:1px solid #E5E7EB;font-size:12px"';
  const tdr = 'style="padding:7px 8px;border-bottom:1px solid #E5E7EB;font-size:12px;text-align:right;white-space:nowrap"';
  const card = (lbl,val,col) => '<td style="width:33%;padding:6px"><div style="background:#F8FAFC;border:1px solid #E5E7EB;border-radius:10px;padding:10px 12px"><div style="font-size:11px;color:#6B7280">'+lbl+'</div><div style="font-size:17px;font-weight:700;color:'+col+'">'+val+'</div></div></td>';
  let h = '<div style="width:794px;padding:36px 40px;background:#fff;color:#1F2937;font-family:\'Hind Siliguri\',\'Poppins\',sans-serif;line-height:1.5">'+
    '<div style="background:'+themeVals().g+';color:#fff;border-radius:14px;padding:18px 22px">'+
      '<div style="font-size:22px;font-weight:700">'+t('appName')+'</div>'+
      '<div style="font-size:14px;opacity:.95;margin-top:2px">'+per.title+' — '+per.label+'</div>'+
      '<div style="font-size:12px;opacity:.9;margin-top:4px">'+esc(db.name)+' · '+t('generatedOn')+': '+fmtDate(todayStr())+'</div></div>'+
    '<table style="width:100%;border-collapse:collapse;margin:14px -6px 4px"><tr>'+card(t('totalIncome'),fmtAmount(tt.income),'#16A34A')+card(t('totalExpense'),fmtAmount(tt.expense),'#DC2626')+card(t('balance'),fmtAmount(tt.net),tt.net>=0?'#0D9C6F':'#DC2626')+'</tr></table>';
  if (!list.length) return h+'<p style="text-align:center;color:#6B7280;padding:40px 0">'+t('noData')+'</p></div>';

  // limit info
  const byDay = {};
  list.forEach(e => { if (e.type==='expense') byDay[e.date] = (byDay[e.date]||0)+e.amount; });
  if (REP.type === 'daily'){
    const sp = byDay[REP.day]||0, over = sp - limit;
    h += '<div style="margin:10px 0;padding:10px 14px;border-radius:10px;background:'+(over>0?'#FEF2F2':'#F0FDF4')+';font-size:13px"><b>'+t('dailyLimitLbl')+':</b> '+fmtAmount(limit)+' &nbsp;|&nbsp; <b>'+t('limitStatus')+':</b> '+(over>0?'<span style="color:#DC2626">'+t('overLimit')+' '+fmtAmount(over)+'</span>':'<span style="color:#16A34A">'+t('withinLimit')+'</span>')+'</div>';
  } else {
    const days = Object.keys(byDay).sort();
    const overDays = days.filter(d => byDay[d] > limit).length;
    h += '<div style="margin:10px 0;padding:10px 14px;border-radius:10px;background:#F0FDF4;font-size:13px"><b>'+t('dailyLimitLbl')+':</b> '+fmtAmount(limit)+' &nbsp;|&nbsp; <b>'+t('daysOver')+':</b> '+fmtNum(overDays)+' / '+fmtNum(days.length)+'</div>';
  }
  // category breakdown
  const byCat = {};
  list.filter(e => e.type==='expense').forEach(e => { const k = catName(e); byCat[k] = (byCat[k]||0)+e.amount; });
  const cats = Object.keys(byCat).sort((a,b) => byCat[b]-byCat[a]);
  if (cats.length){
    h += '<div style="font-weight:700;font-size:14px;margin:14px 0 6px">'+t('catBreakdown')+'</div><table style="width:100%;border-collapse:collapse"><tr><th '+th+'>'+t('category')+'</th><th '+th.replace('left','right')+'>'+t('amount')+'</th><th '+th.replace('left','right')+'>%</th></tr>';
    cats.forEach(k => { h += '<tr><td '+td+'>'+esc(k)+'</td><td '+tdr+'>'+fmtAmount(byCat[k])+'</td><td '+tdr+'>'+fmtNum(tt.expense ? Math.round(byCat[k]/tt.expense*100) : 0)+'%</td></tr>'; });
    h += '</table>';
  }
  // grouped summary
  if (REP.type !== 'daily'){
    const grp = {};
    list.forEach(e => { const k = REP.type==='monthly' ? e.date : e.date.slice(0,7); const g = grp[k] = grp[k] || { i:0, x:0 }; if (e.type==='income') g.i += e.amount; else g.x += e.amount; });
    h += '<div style="font-weight:700;font-size:14px;margin:16px 0 6px">'+(REP.type==='monthly'?t('dayWise'):t('monthWise'))+'</div><table style="width:100%;border-collapse:collapse"><tr><th '+th+'>'+t('date')+'</th><th '+th.replace('left','right')+'>'+t('income')+'</th><th '+th.replace('left','right')+'>'+t('expense')+'</th><th '+th.replace('left','right')+'>'+t('balance')+'</th></tr>';
    Object.keys(grp).sort().forEach(k => { const g = grp[k]; h += '<tr><td '+td+'>'+(REP.type==='monthly'?fmtDate(k):monthName(k))+'</td><td '+tdr+'>'+fmtAmount(g.i)+'</td><td '+tdr+'>'+fmtAmount(g.x)+'</td><td '+tdr+'>'+fmtAmount(g.i-g.x)+'</td></tr>'; });
    h += '<tr><td '+td+'><b>'+t('total')+'</b></td><td '+tdr+'><b>'+fmtAmount(tt.income)+'</b></td><td '+tdr+'><b>'+fmtAmount(tt.expense)+'</b></td><td '+tdr+'><b>'+fmtAmount(tt.net)+'</b></td></tr></table>';
  }
  // transactions (daily & monthly)
  if (REP.type !== 'yearly'){
    h += '<div style="font-weight:700;font-size:14px;margin:16px 0 6px">'+t('details')+'</div><table style="width:100%;border-collapse:collapse"><tr><th '+th+'>'+t('date')+'</th><th '+th+'>'+t('category')+'</th><th '+th+'>'+t('note')+'</th><th '+th.replace('left','right')+'>'+t('amount')+'</th></tr>';
    list.forEach(e => { h += '<tr><td '+td+'>'+fmtDate(e.date)+'</td><td '+td+'>'+esc(catName(e))+'</td><td '+td+'>'+esc(e.note||'')+'</td><td '+tdr+' ><span style="color:'+(e.type==='income'?'#16A34A':'#DC2626')+'">'+(e.type==='income'?'+':'-')+fmtAmount(e.amount)+'</span></td></tr>'; });
    h += '</table>';
  }
  return h+'</div>';
}
function loadScript(src){
  return new Promise((res,rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function downloadReport(){
  if (REP.busy) return;
  const val = REP.type==='daily' ? REP.day : REP.type==='monthly' ? REP.month : REP.year;
  const err = document.getElementById('rep-error'), btn = document.getElementById('rep-btn');
  if (!val){ err.textContent = t('errDate'); return; }
  REP.busy = true; err.textContent = ''; btn.textContent = t('pdfPreparing'); btn.disabled = true;
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1';
  try {
    if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    host.innerHTML = buildReportHTML(); document.body.appendChild(host);
    try { await document.fonts.ready; } catch(e){}
    const node = host.firstElementChild;
    const canvas = await html2canvas(node, { scale:2, backgroundColor:'#ffffff', useCORS:true });
    const pdf = new window.jspdf.jsPDF({ unit:'pt', format:'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const imgH = canvas.height * pw / canvas.width;
    const pageCanvasH = Math.floor(ph * canvas.width / pw);
    let y = 0, first = true;
    while (y < canvas.height){
      const sh = Math.min(pageCanvasH, canvas.height - y);
      const pc = document.createElement('canvas'); pc.width = canvas.width; pc.height = sh;
      pc.getContext('2d').drawImage(canvas, 0, y, canvas.width, sh, 0, 0, canvas.width, sh);
      if (!first) pdf.addPage();
      pdf.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, sh * pw / canvas.width);
      first = false; y += sh;
    }
    const nm = 'pocket-money-'+REP.type+'-'+val+'.pdf';
    pdf.save(nm);
    toast(t('pdfDone'));
  } catch(e){
    err.textContent = t('pdfFail')+' (internet লাগবে)';
  } finally {
    host.remove(); REP.busy = false;
    const b = document.getElementById('rep-btn'); if (b){ b.disabled = false; b.textContent = t('download'); }
  }
}


/* ================= THEME PICKER ================= */
function openThemePicker(){ pushModal(themeModalHTML); }
function themeModalHTML(){
  const cur = db.themeId || 'rg';
  let h = '';
  Object.keys(THEMES).forEach(id => {
    const th = THEMES[id], g = th.g || 'linear-gradient(135deg,'+th.p+','+th.d+')';
    h += '<button class="swatch'+(cur===id?' active':'')+'" onclick="setThemeId(\''+id+'\')"><span class="sw-c" style="background:'+g+'">'+(cur===id?icon('check',20):'')+'</span>'+t(th.k)+'</button>';
  });
  const cc = db.customColor || '#16A34A';
  h += '<label class="swatch'+(cur==='custom'?' active':'')+'"><span class="sw-c" style="background:'+cc+'">'+(cur==='custom'?icon('check',20):icon('plus',20))+'</span>'+t('thCustom')+'<input type="color" value="'+cc+'" onchange="setCustomColor(this.value)" style="position:absolute;opacity:0;width:1px;height:1px"></label>';
  return '<div class="modal-header"><span class="modal-title">'+t('themeColor')+'</span><button class="icon-btn sm" onclick="popModal()">'+icon('x',18)+'</button></div>'+
    '<div class="swatch-grid">'+h+'</div>';
}
function setThemeId(id){ db.themeId = id; saveDB(); applyTheme(); renderApp(); }
function setCustomColor(c){ db.customColor = c; db.themeId = 'custom'; saveDB(); applyTheme(); renderApp(); }

/* ================= CATEGORY MANAGER (expense heads & income sources) ================= */
function openCatManager(type, fromEntry){
  UI.cm = { type: type || 'expense', name:'', color: CAT_PALETTE[0], fromEntry: !!fromEntry };
  pushModal(catManagerHTML);
}
function catManagerHTML(){
  const c = UI.cm;
  let rows = '';
  customCats().filter(x => x.type === c.type).forEach(x => {
    rows += '<div class="cc-row"><span class="cc-dot" style="background:'+x.color+'"></span><span class="cc-name">'+esc(x.name)+'</span><button class="icon-btn sm" onclick="askDeleteCC(\''+x.id+'\')">'+icon('trash',16)+'</button></div>';
  });
  if (!rows) rows = '<div class="empty" style="padding:14px">'+t('noCustomCats')+'</div>';
  let cols = '';
  CAT_PALETTE.forEach(k => { cols += '<span class="col-dot'+(c.color===k?' active':'')+'" style="background:'+k+'" onclick="setCMColor(\''+k+'\')"></span>'; });
  return '<div class="modal-header"><span class="modal-title">'+t('manageCats')+'</span><button class="icon-btn sm" onclick="popModal()">'+icon('x',18)+'</button></div>'+
    '<div class="chip-row wrap in-modal"><button class="chip'+(c.type==='expense'?' active':'')+'" onclick="setCMType(\'expense\')">'+t('expenseCats')+'</button><button class="chip'+(c.type==='income'?' active':'')+'" onclick="setCMType(\'income\')">'+t('incomeSources')+'</button></div>'+
    rows+
    '<div class="field" style="margin-top:14px"><label>'+t('addNewCat')+' — '+t('catNameLbl')+'</label><input class="input" maxlength="24" value="'+esc(c.name)+'" placeholder="'+t('catNamePh')+'" oninput="UI.cm.name=this.value"></div>'+
    '<div class="col-row">'+cols+'</div>'+
    '<div class="form-error" id="cm-error"></div>'+
    '<button class="btn-primary" onclick="addCC()">'+t('add')+'</button>';
}
function setCMType(x){ UI.cm.type = x; renderModalTop(); }
function setCMColor(k){ UI.cm.color = k; renderModalTop(); }
function addCC(){
  const c = UI.cm, name = (c.name||'').trim();
  if (!name){ document.getElementById('cm-error').textContent = t('errCatName'); return; }
  const item = { id: uid('c_'), type:c.type, name:name, color:c.color };
  db.customCats = customCats().concat([item]); saveDB();
  if (c.fromEntry && UI.entry){ UI.entry.type = c.type; UI.entry.category = item.id; popModal(); }
  else { c.name = ''; renderModalTop(); }
  renderApp(); toast(t('catAdded'));
}
function askDeleteCC(id){
  confirmAction(t('deleteCatTitle'), t('deleteCatDesc'), () => {
    db.customCats = customCats().filter(x => x.id !== id); saveDB();
    if (UI.entry && UI.entry.category === id) UI.entry.category = UI.entry.type === 'income' ? 'received' : 'meal';
    renderModalTop(); renderApp(); toast(t('catDeleted'), 'info');
  });
}

/* ================= BOOT ================= */
function boot(){
  db = loadDB();
  if (!db || !db.name || !db.pinHash){ db = freshDB(); UI.screen = 'setup'; }
  else { if (!db.ledger) db.ledger = []; if (db.dailyPocketLimit == null) db.dailyPocketLimit = 50; if (db.lockEnabled == null) db.lockEnabled = true; if (!db.customCats) db.customCats = []; if (!db.themeId) db.themeId = 'rg';
    if (db.lockEnabled){ UI.screen = 'unlock'; } else { UI.screen = 'main'; UI.tab = 'home'; histPush({ app:1 }); } }
  applyTheme();
  renderApp();
}
boot();
